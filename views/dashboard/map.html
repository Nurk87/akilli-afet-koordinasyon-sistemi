<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>AFAD | Saha Operasyon Merkezi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://leaflet.github.io/Leaflet.heat/dist/leaflet-heat.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.css" />
  <script src="https://unpkg.com/leaflet-routing-machine@latest/dist/leaflet-routing-machine.js"></script>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --afad-navy: #003366;
      --afad-red: #e30613;
      --glass-panel: rgba(0, 31, 63, 0.85);
    }

    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Outfit', sans-serif; background: #001021; }
    #map { height: 100vh; width: 100%; z-index: 1; }
    
    /* Gelişmiş Glassmorphism Sidebar */
    .map-overlay {
      position: absolute;
      top: 25px;
      right: 25px;
      z-index: 1000;
      width: 360px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      pointer-events: none;
    }

    .glass-card {
      background: var(--glass-panel);
      backdrop-filter: blur(20px);
      padding: 22px;
      border-radius: 28px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.1);
      pointer-events: auto;
      color: white;
      transition: all 0.3s;
      animation: fadeInRight 0.6s ease-out;
    }

    @keyframes fadeInRight {
      from { transform: translateX(30px); opacity: 0; }
      to { transform: translateX(0); opacity: 1; }
    }

    .stat-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 15px;
    }

    .mini-stat {
      background: rgba(255,255,255,0.06);
      padding: 15px;
      border-radius: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .mini-stat.urgent { border-bottom: 3px solid var(--afad-red); }
    .mini-stat.normal { border-bottom: 3px solid #f59e0b; }

    .val { font-size: 1.8rem; font-weight: 800; display: block; color: #fff; }
    .label { font-size: 0.65rem; color: #cbd5e1; text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }

    .control-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .control-item:last-child { border: none; }

    /* Premium Toggle */
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #1e293b;
      transition: .4s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px; width: 18px;
      left: 3px; bottom: 3px;
      background-color: white;
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider { background-color: var(--afad-red); }
    input:checked + .slider:before { transform: translateX(20px); }

    .btn-back {
      position: absolute;
      top: 25px;
      left: 25px;
      z-index: 1000;
      background: var(--afad-red);
      color: white;
      padding: 14px 28px;
      border-radius: 20px;
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 10px 20px rgba(227, 6, 19, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.3s;
    }

    .btn-back:hover { transform: scale(1.05); box-shadow: 0 15px 25px rgba(227, 6, 19, 0.5); }

    .log-scroll {
      max-height: 160px;
      overflow-y: auto;
      margin-top: 10px;
      padding-right: 5px;
    }

    .log-scroll::-webkit-scrollbar { width: 4px; }
    .log-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .log-card {
      background: rgba(255,255,255,0.03);
      padding: 12px;
      border-radius: 15px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      border-left: 3px solid #334155;
    }
    .log-card.urgent { border-left-color: var(--afad-red); }

    .pulse-marker { animation: marker-pulse 2s infinite; }
    @keyframes marker-pulse {
      0% { r: 10; fill-opacity: 0.8; }
      70% { r: 20; fill-opacity: 0; }
      100% { r: 10; fill-opacity: 0; }
    }
  </style>
</head>
<body>
  <audio id="alertSound" src="/sounds/emergency.mp3" preload="auto"></audio>
  <audio id="dispatchSound" src="/sounds/dispatch.mp3" preload="auto"></audio>

  <a href="/dashboard" class="btn-back">
    <i class="fas fa-arrow-left"></i> PANELE DÖN
  </a>

  <div id="map"></div>

  <div class="map-overlay">
    <!-- ANA VERİ PANELİ -->
    <div class="glass-card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0; font-weight: 800; font-size: 1.2rem; color: #fff;">
          <i class="fas fa-satellite" style="color: var(--afad-red); margin-right: 12px;"></i> CANLI RADAR
        </h3>
        <span style="font-size: 0.6rem; background: #10b981; padding: 4px 8px; border-radius: 8px; font-weight: 900;">AKTİF</span>
      </div>

      <div class="stat-row">
        <div class="mini-stat urgent">
          <span class="val" id="badge-count-acil">0</span>
          <span class="label">Acil Vaka</span>
        </div>
        <div class="mini-stat normal">
          <span class="val" id="badge-count-normal">0</span>
          <span class="label">Normal</span>
        </div>
      </div>
    </div>

    <!-- KATMAN AYARLARI -->
    <div class="glass-card">
      <h4 style="margin: 0 0 15px 0; font-size: 0.75rem; color: #94a3b8; font-weight: 800; letter-spacing: 1.5px;">KATMAN YÖNETİMİ</h4>
      
      <div class="control-item">
        <span><i class="fas fa-fire-alt" style="color: #f97316; margin-right: 12px;"></i> Isı Haritası</span>
        <label class="switch">
          <input type="checkbox" id="toggle-heat" checked onchange="updateData()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-item">
        <span><i class="fas fa-bullseye" style="color: var(--afad-red); margin-right: 12px;"></i> Talep Noktaları</span>
        <label class="switch">
          <input type="checkbox" id="toggle-markers" checked onchange="updateData()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-item">
        <span><i class="fas fa-users" style="color: #3b82f6; margin-right: 12px;"></i> Aktif Gönüllüler</span>
        <label class="switch">
          <input type="checkbox" id="toggle-volunteers" checked onchange="updateData()">
          <span class="slider"></span>
        </label>
      </div>

      <div class="control-item">
        <span><i class="fas fa-road" style="color: #ef4444; margin-right: 12px;"></i> Yol Kapanmaları</span>
        <label class="switch">
          <input type="checkbox" id="toggle-closures" checked onchange="toggleClosures()">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- ROTA PANELİ (Dinamik) -->
    <div class="glass-card" id="route-panel" style="display: none;">
      <h4 style="margin: 0 0 15px 0; font-size: 0.75rem; color: #94a3b8; font-weight: 800; letter-spacing: 1.5px;">ROTA DETAYLARI</h4>
      <div id="route-info">
        <div style="font-size: 0.9rem; margin-bottom: 10px;">
          <i class="fas fa-map-marker-alt" style="color: #3b82f6;"></i> <span id="route-dist">0 km</span>
          <span style="margin: 0 10px; opacity: 0.3;">|</span>
          <i class="fas fa-clock" style="color: #10b981;"></i> <span id="route-time">0 dk</span>
        </div>
        <div id="route-alert" style="display: none; background: rgba(239, 68, 68, 0.2); padding: 8px 12px; border-radius: 12px; font-size: 0.75rem; color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.3);">
          <i class="fas fa-exclamation-triangle"></i> Yol kapalı! Alternatif rota oluşturuldu.
        </div>
        <button onclick="clearRoute()" style="width: 100%; margin-top: 15px; background: rgba(255,255,255,0.1); border: none; color: white; padding: 8px; border-radius: 10px; cursor: pointer; font-size: 0.75rem; font-weight: 700;">
          ROTAYI TEMİZLE
        </button>
      </div>
    </div>
    </div>

    <!-- LOG PANELİ -->
    <div class="glass-card">
      <h4 style="margin: 0 0 10px 0; font-size: 0.75rem; color: #94a3b8; font-weight: 800; letter-spacing: 1.5px;">OPERASYONEL GÜNCE</h4>
      <div id="map-log" class="log-scroll">
        <div style="text-align: center; color: #64748b; padding: 20px; font-size: 0.8rem;">Veriler taranıyor...</div>
      </div>
    </div>
  </div>

  <script>
    let map;
    let mapMarkers = { acil: [], normal: [], gonullu: [] };
    let heatLayer = null;
    let lastMaxId = 0;
    let routingControl = null;
    let closureLayers = [];
    let currentVolunteers = [];
    let currentRequests = [];

    // TÜRKİYE GENELİ SİMÜLE EDİLEN KAPALI YOLLAR / ENKAZ BÖLGELERİ
    const BLOCKED_ZONES = [
      { name: "Enkaz Bölgesi - İstanbul/Beşiktaş", center: [41.0422, 29.0067], radius: 400 },
      { name: "Yol Çökmesi - Ankara/Kızılay", center: [39.9208, 32.8541], radius: 350 },
      { name: "Lojistik Engel - Hatay/Merkez", center: [36.2023, 36.1606], radius: 500 },
      { name: "Enkaz Bölgesi - Kahramanmaraş", center: [37.5858, 36.9371], radius: 600 },
      { name: "Kapalı Yol - İzmir/Bayraklı", center: [38.4622, 27.1658], radius: 300 }
    ];

    function initMap() {
      // Türkiye Merkezli Görünüm (Zoom 6-7 tüm Türkiye'yi gösterir)
      map = L.map('map', { zoomControl: false }).setView([38.9637, 35.2433], 6);
      
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '© AFAD Koordinasyon'
      }).addTo(map);

      L.control.zoom({ position: 'bottomright' }).addTo(map);
      
      // Kapalı yolları çiz
      toggleClosures();
      updateData();
    }

    function toggleClosures() {
      const show = document.getElementById('toggle-closures').checked;
      
      // Temizle
      closureLayers.forEach(l => map.removeLayer(l));
      closureLayers = [];

      if (show) {
        BLOCKED_ZONES.forEach(zone => {
          const circle = L.circle(zone.center, {
            color: '#ef4444',
            fillColor: '#ef4444',
            fillOpacity: 0.4,
            radius: zone.radius,
            dashArray: '5, 10'
          }).addTo(map);
          circle.bindPopup(`<b>DİKKAT: ${zone.name}</b><br>Bu bölgeden geçiş yapılamaz.`);
          closureLayers.push(circle);
        });
      }
    }

    function playAlert(type = 'emergency') {
      const sound = document.getElementById(type === 'emergency' ? 'alertSound' : 'dispatchSound');
      if (sound) {
        sound.currentTime = 0;
        sound.play().catch(e => console.log('Ses engellendi.'));
      }
    }

    async function updateData() {
      try {
        const res = await fetch('/dashboard/api/map-data', {
          headers: { 'Accept': 'application/json' },
          credentials: 'include'
        });
        const data = await res.json();
        
        currentRequests = data.requests;
        currentVolunteers = data.volunteers;
        
        renderMap(currentRequests, currentVolunteers);
      } catch (err) {
        console.error('Veri Hatası:', err);
      }
    }

    function renderMap(requests, volunteers) {
      // Temizlik
      Object.keys(mapMarkers).forEach(k => {
        mapMarkers[k].forEach(m => map.removeLayer(m));
        mapMarkers[k] = [];
      });
      if (heatLayer) map.removeLayer(heatLayer);

      const showHeat = document.getElementById('toggle-heat').checked;
      const showMarkers = document.getElementById('toggle-markers').checked;
      const showVolunteers = document.getElementById('toggle-volunteers').checked;

      let counts = { acil: 0, normal: 0 };
      let heatPoints = [];
      let currentMaxId = 0;
      let newUrgentFound = false;
      const bounds = L.latLngBounds();

      requests.forEach(r => {
        if (!r.enlem || !r.boylam) return;
        
        const isAcil = r.oncelik === 'acil';
        if (isAcil) counts.acil++; else counts.normal++;

        const pos = [parseFloat(r.enlem), parseFloat(r.boylam)];
        heatPoints.push([...pos, isAcil ? 1.0 : 0.5]);
        bounds.extend(pos);

        if (r.id > lastMaxId) {
          currentMaxId = Math.max(currentMaxId, r.id);
          if (isAcil) newUrgentFound = true;
        }

        if (showMarkers) {
          const color = isAcil ? '#e30613' : '#f59e0b';
          const marker = L.circleMarker(pos, {
            radius: isAcil ? 12 : 8,
            fillColor: color, color: '#fff', weight: 2, opacity: 1, fillOpacity: 0.8
          }).addTo(map);
          
          const popupContent = `
            <div style="font-family:'Outfit'; min-width: 200px;">
              <strong style="color:var(--afad-navy)">${r.baslik}</strong><br>
              <span style="font-size:0.7rem; color:#666">${r.oncelik.toUpperCase()}</span>
              <hr style="opacity:0.1; margin:8px 0">
              <button onclick="smartRouteTo(${r.enlem}, ${r.boylam})" style="background:var(--afad-red); color:white; border:none; padding:8px 12px; border-radius:8px; cursor:pointer; width:100%; font-weight:700">
                <i class="fas fa-route"></i> ROTA ÇİZ
              </button>
            </div>
          `;
          marker.bindPopup(popupContent);
          mapMarkers[isAcil ? 'acil' : 'normal'].push(marker);
        }
      });

      if (showHeat && heatPoints.length > 0) {
        heatLayer = L.heatLayer(heatPoints, {
          radius: 35, blur: 15, maxZoom: 17,
          gradient: { 0.4: '#3b82f6', 0.65: '#10b981', 1: '#e30613' }
        }).addTo(map);
      }

      if (showVolunteers) {
        volunteers.forEach(v => {
          if (!v.enlem || !v.boylam) return;
          const vPos = [parseFloat(v.enlem), parseFloat(v.boylam)];
          const vIcon = L.divIcon({
            html: `<i class="fas fa-location-arrow" style="color: #3b82f6; font-size: 20px; transform: rotate(45deg);"></i>`,
            className: 'v-icon', iconSize: [20, 20]
          });
          const m = L.marker(vPos, { icon: vIcon }).addTo(map);
          
          const popupContent = `
            <div style="font-family:'Outfit'; min-width: 150px; text-align: center;">
              <strong style="color:var(--afad-navy)">${v.ad.toUpperCase()} ${v.soyad.toUpperCase()}</strong><br>
              <span style="font-size:0.75rem; color:#64748b"><i class="fas fa-id-badge"></i> Saha Gönüllüsü</span><br>
              <span style="font-size:0.7rem; color:#10b981; font-weight: bold;">${(v.musaitlik_durumu || 'Müsait').toUpperCase()}</span>
            </div>
          `;
          m.bindPopup(popupContent);
          
          mapMarkers.gonullu.push(m);
        });
      }

      // Otomatik Zoom (Eğer veri varsa ve ilk kez yükleniyorsa)
      if (bounds.isValid() && (lastMaxId === 0 || newUrgentFound)) {
        map.fitBounds(bounds, { padding: [50, 50] });
      }

      if (lastMaxId > 0 && newUrgentFound) playAlert('emergency');
      if (currentMaxId > lastMaxId) lastMaxId = currentMaxId;

      document.getElementById('badge-count-acil').innerText = counts.acil;
      document.getElementById('badge-count-normal').innerText = counts.normal;
      
      updateLogUI(requests.slice(0, 8));
    }

    function updateLogUI(logs) {
      const logBox = document.getElementById('map-log');
      if (logs.length === 0) {
        logBox.innerHTML = '<div style="text-align: center; color: #64748b; padding: 20px;">Henüz vaka yok.</div>';
        return;
      }
      logBox.innerHTML = logs.map(l => `
        <div class="log-card ${l.oncelik === 'acil' ? 'urgent' : ''}">
          <div style="display:flex; justify-content:space-between">
            <strong style="color:white">${l.baslik.substring(0, 20)}</strong>
            <span style="color:${l.oncelik === 'acil' ? '#ef4444':'#f59e0b'}">${l.oncelik.toUpperCase()}</span>
          </div>
          <div style="font-size:0.7rem; color:#94a3b8; margin-top:4px">${l.ilce_adi || 'Bölge'} / ${l.il_adi || 'Merkez'}</div>
        </div>
      `).join('');
    }

    // AKILLI ROTA ALGORİTMASI (SIMÜLASYON)
    function smartRouteTo(lat, lng) {
      if (routingControl) clearRoute();
      
      // 1. En yakın gönüllüyü bul
      let closestVol = null;
      let minDistance = Infinity;

      currentVolunteers.forEach(v => {
        const d = map.distance([lat, lng], [v.enlem, v.boylam]);
        if (d < minDistance) {
          minDistance = d;
          closestVol = v;
        }
      });

      if (!closestVol) {
        alert("Bölgede aktif gönüllü bulunamadı!");
        return;
      }

      const start = [closestVol.enlem, closestVol.boylam];
      const end = [lat, lng];

      // 2. Kapalı bölgelerden geçiyor mu kontrol et
      let isBlocked = false;
      let detourPoint = null;

      BLOCKED_ZONES.forEach(zone => {
        // Basit çizgi-daire kesişim simülasyonu: 
        // Eğer start veya end bir bölgeye çok yakınsa veya orta nokta bölgedeyse kapalı sayalım
        const midPoint = [(start[0]+end[0])/2, (start[1]+end[1])/2];
        const dMid = map.distance(midPoint, zone.center);
        
        if (dMid < zone.radius) {
          isBlocked = true;
          // Detour point: Bölgenin dışından bir nokta uyduralım
          detourPoint = [zone.center[0] + 0.01, zone.center[1] + 0.01]; 
        }
      });

      const waypoints = [L.latLng(start[0], start[1])];
      if (isBlocked && detourPoint) {
        waypoints.push(L.latLng(detourPoint[0], detourPoint[1]));
        document.getElementById('route-alert').style.display = 'block';
      } else {
        document.getElementById('route-alert').style.display = 'none';
      }
      waypoints.push(L.latLng(end[0], end[1]));

      // 3. Rotayı çiz
      routingControl = L.Routing.control({
        waypoints: waypoints,
        lineOptions: { styles: [{ color: '#3b82f6', weight: 6, opacity: 0.8 }] },
        createMarker: function() { return null; }, // Kendi markerlarımızı kullanıyoruz
        addWaypoints: false,
        draggableWaypoints: false,
        show: false // Panel gizli kalsın, biz kendi UI'mızı güncelleyeceğiz
      }).addTo(map);

      routingControl.on('routesfound', function(e) {
        const routes = e.routes;
        const summary = routes[0].summary;
        
        document.getElementById('route-dist').innerText = (summary.totalDistance / 1000).toFixed(1) + ' km';
        document.getElementById('route-time').innerText = Math.round(summary.totalTime / 60) + ' dk';
        document.getElementById('route-panel').style.display = 'block';
        
        playAlert('dispatch');
      });

      map.closePopup();
    }

    function clearRoute() {
      if (routingControl) {
        map.removeControl(routingControl);
        routingControl = null;
      }
      document.getElementById('route-panel').style.display = 'none';
    }

    initMap();
    setInterval(updateData, 10000);
  </script>
</body>
</html>
